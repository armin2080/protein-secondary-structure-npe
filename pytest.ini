[pytest]
# The section-1 modules are flat top-level modules at the repo root; put the repo
# root on sys.path so `import encoding`, `import simulator`, etc. resolve.
pythonpath = .
testpaths = tests
markers =
    slow: shrunken statistical simulator check (empirical frequencies vs spec)
    integration: reads the cached dataset/1A7F.cif; skips if it is not present
